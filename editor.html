<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>X-ART Lab. / 发布文章</title><link rel="stylesheet" href="community.css"></head>
<body class="community-body" data-page="editor">
  <div class="community-shell"><header class="community-header"><a class="community-brand" href="community.html"><img src="x-art-lab-logo-tight.png" alt="X-ART Lab."></a><nav class="community-nav"><a href="community.html">X Art Lab 文库</a><a href="index.html">研究资料</a><a href="moderation.html">审核后台</a></nav><div class="community-account" data-account></div></header>
    <main class="community-main"><div class="community-form-shell"><section class="community-form-card"><p class="community-kicker">X ART LAB / SUBMIT</p><h1 data-editor-heading>发布一篇文库文章。</h1><p>写下作品分析、研究笔记或创作实践。保存草稿后，你可以继续编辑；提交审核后，编辑会决定是否公开。</p><div data-message></div><form id="editor-form"><div class="form-row"><label>标题</label><input name="title" type="text" maxlength="180" required placeholder="例如：沉浸式艺术中的身体与数据"></div><div class="form-row"><label>摘要</label><textarea name="excerpt" rows="3" placeholder="用两三句话说明文章讨论什么。"></textarea></div><div class="form-row"><label>正文</label><textarea name="content" required placeholder="正文支持普通文本和分段。"></textarea></div><div class="form-row"><label>语言</label><select name="locale"><option value="zh">中文</option><option value="en">English</option><option value="fr">Français</option></select></div><div class="form-row"><label>标签（用逗号分隔）</label><input name="tags" type="text" placeholder="研究方法, 作品分析, 创作实践"></div><div class="form-row"><label>封面图（可选）</label><input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="form-actions"><button class="button-secondary" type="submit" data-status="draft">保存草稿</button><button class="button-primary" type="submit" data-status="pending">提交审核</button></div></form></section></div></main><footer class="community-footer">提交后文章不会立即公开，需经过编辑审核。</footer></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="community.js"></script>
</body></html>
