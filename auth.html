<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>X Art Lab 文库 / 登录</title><link rel="stylesheet" href="community.css"></head>
<body class="community-body" data-page="auth">
  <div class="community-shell"><header class="community-header"><a class="community-brand" href="index.html"><img src="x-art-lab-logo-tight.png" alt="X-ART Lab."></a><nav class="community-nav"><a href="community.html">X Art Lab 文库</a><a href="index.html">研究资料</a></nav><div class="community-account"><a href="community.html">返回文库</a></div></header>
    <main class="community-main"><div class="community-form-shell"><section class="community-form-card"><p class="community-kicker">X-ART LAB. / ACCOUNT</p><h1>进入文库。</h1><p>使用邮箱、手机号或第三方账号登录，也可以注册一个投稿账号。文章提交后会进入编辑审核。</p><div class="auth-tabs"><button class="auth-tab active" data-auth-mode="login">登录</button><button class="auth-tab" data-auth-mode="register">注册</button></div><div data-message></div>
      <div class="auth-provider-grid"><button class="button-secondary" type="button" data-oauth="google">使用 Google 登录</button><button class="button-secondary" type="button" data-oauth="github">使用 GitHub 登录</button></div>
      <div class="auth-divider"><span>或使用邮箱</span></div>
      <form id="login-form"><div class="form-row"><label>邮箱</label><input name="email" type="email" autocomplete="email" required></div><div class="form-row"><label>密码</label><input name="password" type="password" autocomplete="current-password" required></div><div class="form-actions"><button class="button-primary" type="submit">登录</button></div></form>
      <div class="auth-divider"><span>或使用手机号验证码</span></div>
      <form id="phone-form"><div class="form-row"><label>手机号（含国家区号）</label><input name="phone" type="tel" autocomplete="tel" placeholder="例如：+86 13800000000" required></div><div class="form-row hidden" data-phone-code-row><label>短信验证码</label><input name="token" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6"></div><div class="form-actions"><button class="button-secondary" type="submit" data-phone-action="send">发送验证码</button><button class="button-primary hidden" type="submit" data-phone-action="verify">验证并登录</button></div></form>
      <p class="auth-note">手机号、Google 和 GitHub 登录需要在 Supabase 身份验证设置中启用对应服务。</p>
      <form id="register-form" class="hidden"><div class="form-row"><label>显示名称</label><input name="display_name" type="text" maxlength="60" required></div><div class="form-row"><label>邮箱</label><input name="email" type="email" autocomplete="email" required></div><div class="form-row"><label>密码（至少 8 位）</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-row"><label>确认密码</label><input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-actions"><button class="button-primary" type="submit">创建账号</button></div></form>
    </section></div></main><footer class="community-footer">账号只用于 X-ART Lab. 文库登录和投稿。</footer></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="community.js"></script>
</body></html>
