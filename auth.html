        en: { htmlLang: "en", title: "X Art Lab Library / Sign in", languageAria: "Language", navLibrary: "X Art Lab Library", navResearch: "Research", secureLogin: "Secure access", backLibrary: "Back to library", accountMeta: "ACCOUNT / 01", secureMeta: "SECURE ACCESS", kicker: "X-ART LAB. / LIBRARY", title: "Enter the library.", intro: "Sign in with email, or register an account to submit articles for editorial review.", loginTab: "Sign in", registerTab: "Register", emailLogin: "Email sign-in", emailLabel: "Email", emailPlaceholder: "Enter your email", passwordLabel: "Password", passwordPlaceholder: "Enter your password", showPassword: "Show password", hidePassword: "Hide password", loginButton: "Sign in", displayNameLabel: "Display name", displayNamePlaceholder: "Enter a display name", passwordCreateLabel: "Password (8 characters minimum)", confirmPasswordLabel: "Confirm password", createAccount: "Create account", footer: "X ART LAB. / RESEARCH LIBRARY", loginError: "Sign-in failed: ", passwordMismatch: "The two passwords do not match.", registerError: "Registration failed: ", registerSuccess: "Registration complete. Opening the library.", registerCheck: "Registration complete. Check your verification email, then return to sign in." },
        fr: { htmlLang: "fr", title: "Bibliothèque X Art Lab / Connexion", languageAria: "Langue", navLibrary: "Bibliothèque X Art Lab", navResearch: "Recherche", secureLogin: "Accès sécurisé", backLibrary: "Retour à la bibliothèque", accountMeta: "COMPTE / 01", secureMeta: "ACCÈS SÉCURISÉ", kicker: "X-ART LAB. / BIBLIOTHÈQUE", title: "Entrer dans la bibliothèque.", intro: "Connectez-vous par e-mail, ou créez un compte pour soumettre des articles à la rédaction.", loginTab: "Connexion", registerTab: "Inscription", emailLogin: "Connexion par e-mail", emailLabel: "E-mail", emailPlaceholder: "Saisissez votre e-mail", passwordLabel: "Mot de passe", passwordPlaceholder: "Saisissez votre mot de passe", showPassword: "Afficher le mot de passe", hidePassword: "Masquer le mot de passe", loginButton: "Se connecter", displayNameLabel: "Nom affiché", displayNamePlaceholder: "Saisissez un nom affiché", passwordCreateLabel: "Mot de passe (8 caractères minimum)", confirmPasswordLabel: "Confirmer le mot de passe", createAccount: "Créer le compte", footer: "X ART LAB. / BIBLIOTHÈQUE DE RECHERCHE", loginError: "Échec de la connexion : ", passwordMismatch: "Les deux mots de passe ne correspondent pas.", registerError: "Échec de l’inscription : ", registerSuccess: "Inscription réussie. Ouverture de la bibliothèque.", registerCheck: "Inscription réussie. Consultez l’e-mail de vérification, puis revenez vous connecter." }
      };
      let activeLanguage = localStorage.getItem("xart-language") || "zh";
      const getText = (key, detail = "") => `${(translations[activeLanguage] || translations.zh)[key] || key}${detail}`;
      window.XART_AUTH_TRANSLATE = (key, detail = "") => getText(key, detail);
      const applyLanguage = (language) => {
        activeLanguage = translations[language] ? language : "zh";
        const dictionary = translations[activeLanguage];
        document.documentElement.lang = dictionary.htmlLang;
        document.title = dictionary.title;
        document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = dictionary[node.dataset.i18n] || node.textContent; });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => { node.placeholder = dictionary[node.dataset.i18nPlaceholder] || node.placeholder; });
        document.querySelectorAll("[data-i18n-title]").forEach((node) => { node.title = dictionary[node.dataset.i18nTitle] || node.title; });
        document.querySelectorAll("[data-i18n-aria-label]").forEach((node) => { node.setAttribute("aria-label", dictionary[node.dataset.i18nAriaLabel] || node.getAttribute("aria-label")); });
        document.querySelectorAll("[data-password-toggle]").forEach((button) => {
          const input = document.getElementById(button.dataset.passwordToggle);
          const key = input?.type === "text" ? "hidePassword" : "showPassword";
          const label = dictionary[key] || key;
          button.setAttribute("aria-label", label);
          button.title = label;
        });
        document.querySelectorAll("[data-language]").forEach((button) => { button.classList.toggle("active", button.dataset.language === activeLanguage); });
        localStorage.setItem("xart-language", activeLanguage);
      };
      document.querySelectorAll("[data-language]").forEach((button) => button.addEventListener("click", () => applyLanguage(button.dataset.language)));
      applyLanguage(activeLanguage);
    })();
  </script>
