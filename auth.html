<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>X Art Lab 文库 / 登录</title><link rel="stylesheet" href="community.css"></head>
<body class="community-body auth-page" data-page="auth">
  <div class="community-shell"><header class="community-header"><a class="community-brand" href="index.html"><img src="x-art-lab-logo-tight.png" alt="X-ART Lab."></a><nav class="community-nav"><a href="community.html">X Art Lab 文库</a><a href="index.html">研究资料</a></nav><div class="community-account"><span class="auth-status"><i></i>安全登录</span><a href="community.html">返回文库</a></div></header>
    <main class="auth-main"><div class="community-form-shell auth-shell"><section class="community-form-card auth-card"><div class="auth-card-meta"><span>ACCOUNT / 01</span><span>SECURE ACCESS</span></div><p class="community-kicker">X-ART LAB. / LIBRARY</p><h1>进入文库。</h1><p>使用邮箱、手机号或第三方账号登录，也可以注册一个投稿账号。文章提交后会进入编辑审核。</p><div class="auth-tabs"><button class="auth-tab active" data-auth-mode="login">登录</button><button class="auth-tab" data-auth-mode="register">注册</button></div><div data-message></div>
      <div class="auth-provider-grid"><button class="button-secondary auth-provider" type="button" data-oauth="google"><span class="provider-icon">G</span><span>Google</span></button><button class="button-secondary auth-provider" type="button" data-oauth="github"><span class="provider-icon">⌘</span><span>GitHub</span></button></div>
      <div class="auth-divider"><span>邮箱登录</span></div>
      <form id="login-form"><div class="form-row"><label>邮箱</label><input name="email" type="email" autocomplete="email" required></div><div class="form-row"><label>密码</label><input name="password" type="password" autocomplete="current-password" required></div><div class="form-actions"><button class="button-primary" type="submit">登录</button></div></form>
      <div class="auth-divider"><span>或使用手机号验证码</span></div>
      <form id="phone-form"><div class="form-row"><label>国家/地区区号 + 手机号</label><div class="phone-input-group"><input name="country_code" type="tel" value="+86" inputmode="tel" pattern="\+\d{1,4}" list="country-codes" aria-label="国家/地区区号" title="请输入 + 加国家/地区区号" required><input name="phone" type="tel" autocomplete="tel" placeholder="请输入手机号，不含国家区号" required></div><datalist id="country-codes"><option value="+86" label="中国大陆"></option><option value="+33" label="法国"></option><option value="+1" label="美国 / 加拿大"></option><option value="+44" label="英国"></option><option value="+81" label="日本"></option><option value="+82" label="韩国"></option><option value="+49" label="德国"></option><option value="+39" label="意大利"></option><option value="+34" label="西班牙"></option><option value="+61" label="澳大利亚"></option><option value="+7" label="俄罗斯 / 哈萨克斯坦"></option><option value="+91" label="印度"></option><option value="+55" label="巴西"></option><option value="+971" label="阿联酋"></option><option value="+65" label="新加坡"></option><option value="+852" label="中国香港"></option><option value="+853" label="中国澳门"></option><option value="+886" label="中国台湾"></option><option value="+20" label="埃及"></option><option value="+27" label="南非"></option><option value="+52" label="墨西哥"></option><option value="+62" label="印度尼西亚"></option><option value="+63" label="菲律宾"></option><option value="+64" label="新西兰"></option><option value="+66" label="泰国"></option><option value="+84" label="越南"></option><option value="+90" label="土耳其"></option><option value="+92" label="巴基斯坦"></option><option value="+98" label="伊朗"></option><option value="+212" label="摩洛哥"></option><option value="+213" label="阿尔及利亚"></option><option value="+234" label="尼日利亚"></option><option value="+254" label="肯尼亚"></option><option value="+351" label="葡萄牙"></option><option value="+352" label="卢森堡"></option><option value="+353" label="爱尔兰"></option><option value="+354" label="冰岛"></option><option value="+358" label="芬兰"></option><option value="+380" label="乌克兰"></option><option value="+420" label="捷克"></option><option value="+48" label="波兰"></option><option value="+41" label="瑞士"></option><option value="+43" label="奥地利"></option><option value="+56" label="智利"></option><option value="+57" label="哥伦比亚"></option><option value="+598" label="乌拉圭"></option><option value="+673" label="文莱"></option><option value="+880" label="孟加拉国"></option><option value="+960" label="马尔代夫"></option><option value="+966" label="沙特阿拉伯"></option><option value="+972" label="以色列"></option><option value="+974" label="卡塔尔"></option><option value="+977" label="尼泊尔"></option><option value="+998" label="乌兹别克斯坦"></option></datalist></div><div class="form-row hidden" data-phone-code-row><label>短信验证码</label><input name="token" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6"></div><div class="form-actions"><button class="button-secondary" type="submit" data-phone-action="send">发送验证码</button><button class="button-primary hidden" type="submit" data-phone-action="verify">验证并登录</button></div></form>
      <p class="auth-note">支持所有国家/地区：可从常用区号提示中选择，也可以直接输入其他国际区号。Google、GitHub 登录需要在对应平台完成身份验证配置。账号只用于 X Art Lab. 文库和投稿。</p>
      <form id="register-form" class="hidden"><div class="form-row"><label>显示名称</label><input name="display_name" type="text" maxlength="60" required></div><div class="form-row"><label>邮箱</label><input name="email" type="email" autocomplete="email" required></div><div class="form-row"><label>密码（至少 8 位）</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-row"><label>确认密码</label><input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-actions"><button class="button-primary" type="submit">创建账号</button></div></form>
    </section></div></main><footer class="community-footer">X ART LAB. / RESEARCH LIBRARY <span>2026</span></footer></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="community.js"></script>
  <script>
    (() => {
      const form = document.querySelector("#phone-form");
      const country = document.querySelector("#phone-form [name=country_code]");
      const phone = document.querySelector("#phone-form [name=phone]");
      if (!form || !country || !phone) return;
      form.addEventListener("submit", () => {
        phone.value = (country.value + " " + phone.value.replace(/^\+\d+[\s-]*/, "").trim()).trim();
      }, true);
    })();
  </script>
</body></html>
