  <script>
    (() => {
      const form = document.querySelector("#phone-form");
      const country = document.querySelector("#phone-form [name=country_code]");
      const phone = document.querySelector("#phone-form [name=phone]");
      if (!form || !country || !phone) return;
      form.addEventListener("submit", () => {
        phone.value = (country.value + " " + phone.value.replace(/^\+\d+[\s-]*/, "").trim()).trim();
      }, true);
    })();
  </script>
